name: Publish Rust crate to crates.io

on:
  workflow_call:
    inputs:
      crate_name:
        description: "Name of the crate to publish (optional - will publish root package if not specified)"
        required: false
        type: string
      expected_version:
        description: "Expected crate version (optional - if provided, must match the crate's Cargo.toml version)"
        required: false
        type: string
      pre_publish_command:
        description: "Command to run in the repository root before publishing (optional - for crates that package generated files rather than committing them)"
        required: false
        type: string
      allow_dirty:
        description: "Pass --allow-dirty to cargo publish, so that files not committed to git can still be packaged (optional - tracked files must still be unmodified)"
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository contents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Uninstall existing Rust toolchain (workaround for some runner images)
        run: rustup toolchain uninstall stable

      - name: Setup Rust toolchain with caching
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Validate input combinations
        if: inputs.expected_version != '' && inputs.crate_name == ''
        run: |
          echo "::error::expected_version requires crate_name to be specified"
          exit 1

      - name: Verify expected version matches crate version
        if: inputs.expected_version != '' && inputs.crate_name != ''
        run: |
          EXPECTED_VERSION="${INPUTS_EXPECTED_VERSION}"
          # Strip leading 'v' if present (e.g., v1.0.0 -> 1.0.0)
          EXPECTED_VERSION="${EXPECTED_VERSION#v}"
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r ".packages[] | select(.name == \"${INPUTS_CRATE_NAME}\") | .version")
          if [ "$EXPECTED_VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::Expected version ($EXPECTED_VERSION) does not match crate version ($CRATE_VERSION)"
            exit 1
          fi
        env:
          INPUTS_EXPECTED_VERSION: ${{ inputs.expected_version }}
          INPUTS_CRATE_NAME: ${{ inputs.crate_name }}

      # Used to build generated files that are not checked into git,
      # for instance a binary wasm file which is generated prior
      # to publishing.
      - name: Run pre-publish command
        if: inputs.pre_publish_command != ''
        shell: bash
        run: eval "${INPUTS_PRE_PUBLISH_COMMAND}"
        env:
          INPUTS_PRE_PUBLISH_COMMAND: ${{ inputs.pre_publish_command }}

      # --allow-dirty is meant to cover generated files that git ignores. It
      # also suppresses the check on everything else, so make that narrower
      # again: nothing under version control may have been modified.
      - name: Verify no tracked files were modified
        if: inputs.allow_dirty
        shell: bash
        run: |
          modified="$(git status --porcelain --untracked-files=no)"
          if [ -n "${modified}" ]; then
            echo "::error::allow_dirty was requested, but these tracked files have been modified:"
            echo "${modified}"
            exit 1
          fi

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish to crates.io (specific crate)
        if: inputs.crate_name != ''
        shell: bash
        run: |
          args=(publish --locked --package "${INPUTS_CRATE_NAME}")
          if [ "${INPUTS_ALLOW_DIRTY}" = "true" ]; then
            args+=(--allow-dirty)
          fi
          cargo "${args[@]}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          INPUTS_CRATE_NAME: ${{ inputs.crate_name }}
          INPUTS_ALLOW_DIRTY: ${{ inputs.allow_dirty }}

      - name: Publish to crates.io (root package)
        if: inputs.crate_name == ''
        shell: bash
        run: |
          args=(publish --locked)
          if [ "${INPUTS_ALLOW_DIRTY}" = "true" ]; then
            args+=(--allow-dirty)
          fi
          cargo "${args[@]}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          INPUTS_ALLOW_DIRTY: ${{ inputs.allow_dirty }}
