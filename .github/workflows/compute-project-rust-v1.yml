# Note:
#
# This workflow expects the calling project to have a
# rust-toolchain.toml file which specifies the necessary version of
# the toolchain, the necessary targets (matching those specified in
# the project's .cargo/config.toml), and at least the 'clippy' and
# 'rustfmt' toolchain components.
#
# Example:
#
# [toolchain]
# channel = "stable"
# targets = [ "wasm32-wasip1" ]
# profile = "default"

name: Common Test

on:
  workflow_call:
    secrets:
      gh_token:
        required: true
    inputs:
      runner_label:
        description: 'Label for the runner to be used for the jobs.'
        default: 'ubuntu-latest'
        required: false
        type: string

defaults:
  run:
    shell: bash

jobs:
  common-test:
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: Checkout repository contents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Uninstall existing Rust toolchain (workaround for some runner images)
        run: rustup toolchain uninstall stable

      - name: Setup Rust toolchain with caching
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-audit, wasm-opt

      - name: Check
        run: RUSTFLAGS="--deny warnings" cargo check

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy

      - name: Audit
        run: cargo audit

      - name: Build (using cargo)
        run: RUSTFLAGS="--deny warnings" cargo build --profile release

      - name: Install Fastly CLI
        uses: fastly/compute-actions/setup@a25cf83ef5c19ef7d86f1eebffcd8f6c02ddc786 # v14
        with:
          token: ${{ secrets.gh_token }}

      - name: Build (using CLI)
        uses: fastly/compute-actions/build@a25cf83ef5c19ef7d86f1eebffcd8f6c02ddc786 # v14

      - name: Upload WASM package as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-package
          path: bin/main.wasm
          if-no-files-found: error
          compression-level: 0
